[package]
name = "ees-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ees-core = { path = "../ees-core" }
wasm-bindgen = "0.2"
rsa   = { version = "0.10.0-rc.17", features = ["pkcs5"] }
pkcs8 = { version = "0.11", features = ["encryption", "getrandom"] }