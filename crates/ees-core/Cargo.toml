[package]
name = "ees-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rsa = "0.10.0-rc.17"
rand = "0.10.0"
aes-gcm = "0.10.3"
sha2 = "0.11.0-rc.5"
base-62 = "0.1.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
wasm-bindgen = "0.2.126"
getrandom = { version = "0.2", features = ["js"] } #Solve problem with packing into WASM
getrandom4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }