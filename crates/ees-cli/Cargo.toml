[package]
name = "ees-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ees"
path = "src/main.rs"

[dependencies]
ees-core = { path = "../ees-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rsa = "0.10.0-rc.17"
sha2 = "0.11.0-rc.5"