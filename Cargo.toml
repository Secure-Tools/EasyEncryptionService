[package]
name = "EasyEncryptionService"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ees"
path = "src/main.rs"

[dependencies]
rsa = { version="0.10.0-rc.17" , features=["pkcs5"]}
rand = "0.10.0"
aes-gcm = "0.10.3"
sha2 = "0.11.0-rc.5"
base-62 = "0.1.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
rpassword = "7"
arboard = "3"